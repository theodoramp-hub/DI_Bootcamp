<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Create a solar system</title>
        <style>
            body {
                background-color: black;
                padding: 10px;
            }
            .planet {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                text-align: center;
                padding: 10px;
                position: relative;
                border: 2px solid white;
            }
            .mercury { background-color: gray; }
            .venus { background-color: yellow; }
            .earth { background-color: blue; }
            .mars { background-color: red; }
            .jupiter { background-color: orange; }
            .saturn { background-color: gold; }
            .uranus { background-color: lightblue; }
            .neptune { background-color: darkblue; }
            
            .moon {
                position: absolute;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                background: rgb(237, 237, 237);
                border: 5px solid red;
            }
        </style>
    </head>
    <body>

    <section class="listPlanets"></section>

    <script src="script.js" defer></script>
    </body>
</html>
